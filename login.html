<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — IS 800 Beam Design Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1120;--panel:#111827;--border:#1e3050;--accent:#38bdf8;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;width:100%;max-width:360px;position:relative}
.lang-switch{position:absolute;top:14px;right:14px;background:#0b1120;border:1px solid #334155;color:var(--text);font-size:10px;padding:4px 6px;border-radius:5px;font-family:'Courier New',monospace;max-width:110px}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.sub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:20px;letter-spacing:1px}
.tabs2{display:flex;gap:0;margin-bottom:18px;border:1px solid #334155;border-radius:8px;overflow:hidden}
.tabs2 a{flex:1;text-align:center;padding:9px 4px;font-size:11px;text-decoration:none;color:var(--muted);font-weight:bold;letter-spacing:.5px}
.tabs2 a.active{background:var(--accent);color:#000}
label{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px;margin-top:12px}
input{width:100%;background:#0b1120;border:1px solid #334155;color:var(--text);padding:9px 10px;border-radius:6px;font-family:'Courier New',monospace;font-size:13px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;padding:11px;background:var(--accent);border:none;border-radius:6px;color:#000;cursor:pointer;font-size:12px;font-weight:bold;font-family:'Courier New',monospace;letter-spacing:1px;margin-top:14px}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-google{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:8px}
.msg{font-size:11px;text-align:center;margin-top:12px;min-height:14px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.foot a{color:var(--accent);text-decoration:none}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:#475569;font-size:10px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#334155}
.hidden{display:none}
.verify-box{background:#1c1608;border:1px solid var(--green);border-radius:6px;padding:14px;font-size:11px;color:#fcd34d;margin-top:12px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <select class="lang-switch" onchange="setLang(this.value)"></select>
  <div class="tabs2"><a href="signup.html">CREATE ACCOUNT</a><a href="login.html" class="active">LOG IN</a></div>
  <h1 data-i18n="login_title">⚙ LOG IN</h1>
  <div class="sub" data-i18n="login_sub">IS 800 STEEL BEAM DESIGN TOOL</div>

  <div id="email-form">
    <label data-i18n="email_label">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label data-i18n="password_label">Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button id="btnLogin" onclick="doLogin()" data-i18n="login_btn">LOG IN</button>
  </div>

  <div class="divider" data-i18n="or">— or —</div>
  <button class="btn-google" onclick="doGoogleLogin()"><span>🔵</span> <span data-i18n="google_btn">Continue with Google</span></button>

  <div id="verify-box" class="verify-box hidden">
    <span data-i18n="verify_box_msg">⚠️ Aapka email abhi verify nahi hua hai.</span><br>
    <span data-i18n="verify_box_msg2">Signup ke waqt bheja gaya verification link check karo (inbox/spam).</span><br>
    <button onclick="resendVerification()" style="margin-top:10px" data-i18n="resend_btn">Resend Verification Email</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="foot">
    <a href="#" onclick="doReset();return false;" data-i18n="forgot">Forgot password?</a><br><br>
    <a href="help.html" style="color:#64748b" data-i18n="help_link">❓ How to use this app</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="translations.js"></script>
<script>
function setMsg(text,cls){const m=document.getElementById("msg");m.textContent=text;m.className="msg "+(cls||"");}
let pendingUnverifiedUser=null;

async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("password").value;
  if(!email||!pw){setMsg(t("err_fill_both"),"err");return;}
  const btn=document.getElementById("btnLogin");
  btn.disabled=true;setMsg(t("logging_in"),"");
  document.getElementById("verify-box").classList.add("hidden");
  try{
    const cred=await auth.signInWithEmailAndPassword(email,pw);
    const isPasswordAccount=cred.user.providerData.some(p=>p.providerId==="password");
    if(isPasswordAccount && !cred.user.emailVerified){
      pendingUnverifiedUser=cred.user;
      document.getElementById("verify-box").classList.remove("hidden");
      setMsg(t("err_verify_first"),"err");
      await auth.signOut();
      btn.disabled=false;
      return;
    }
    await ensureUserDoc(cred.user);
    window.location.href="select-code.html";
  }catch(e){
    setMsg(t("err_login_failed"),"err");
    btn.disabled=false;
  }
}
async function resendVerification(){
  if(!pendingUnverifiedUser){setMsg(t("err_login_failed"),"err");return;}
  try{
    await pendingUnverifiedUser.sendEmailVerification();
    setMsg(t("resent_ok"),"ok");
  }catch(e){
    setMsg(t("err_reset_failed"),"err");
  }
}
async function doReset(){
  const email=document.getElementById("email").value.trim();
  if(!email){setMsg(t("err_reset_email_first"),"err");return;}
  try{
    await auth.sendPasswordResetEmail(email);
    setMsg(t("reset_sent"),"ok");
  }catch(e){
    setMsg(t("err_reset_failed"),"err");
  }
}

async function doGoogleLogin(){
  setMsg("Google...","");
  try{
    const cred=await auth.signInWithPopup(googleProvider);
    await ensureUserDoc(cred.user);
    window.location.href="select-code.html";
  }catch(e){
    setMsg("Google sign-in fail hua: "+(e.message||""),"err");
  }
}
</script>
</body>
</html>
