<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — IS 800 Beam Design Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1120;--panel:#111827;--border:#1e3050;--accent:#38bdf8;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;width:100%;max-width:360px}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.sub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:20px;letter-spacing:1px}
label{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px;margin-top:12px}
input{width:100%;background:#0b1120;border:1px solid #334155;color:var(--text);padding:9px 10px;border-radius:6px;font-family:'Courier New',monospace;font-size:13px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;padding:11px;background:var(--accent);border:none;border-radius:6px;color:#000;cursor:pointer;font-size:12px;font-weight:bold;font-family:'Courier New',monospace;letter-spacing:1px;margin-top:18px}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:11px;text-align:center;margin-top:12px;min-height:14px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>⚙ LOG IN</h1>
  <div class="sub">IS 800 STEEL BEAM DESIGN TOOL</div>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">

  <button id="btnLogin" onclick="doLogin()">LOG IN</button>
  <div class="msg" id="msg"></div>
  <div class="foot">
    No account? <a href="signup.html">Sign up</a><br><br>
    <a href="#" onclick="doReset();return false;">Forgot password?</a><br><br>
    <a href="help.html" style="color:#64748b">❓ How to use this app</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function setMsg(text,cls){const m=document.getElementById("msg");m.textContent=text;m.className="msg "+(cls||"");}

async function doLogin(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("password").value;
  if(!email||!pw){setMsg("Email aur password bharo.","err");return;}
  const btn=document.getElementById("btnLogin");
  btn.disabled=true;setMsg("Login ho raha hai...","");
  try{
    await auth.signInWithEmailAndPassword(email,pw);
    window.location.href="index.html";
  }catch(e){
    setMsg("Email ya password galat hai.","err");
    btn.disabled=false;
  }
}
async function doReset(){
  const email=document.getElementById("email").value.trim();
  if(!email){setMsg("Pehle apna email box mein daalo, phir 'Forgot password' dabao.","err");return;}
  try{
    await auth.sendPasswordResetEmail(email);
    setMsg("Password reset link email pe bhej di gayi hai.","ok");
  }catch(e){
    setMsg("Reset email nahi bhej paya — email check karo.","err");
  }
}
</script>
</body>
</html>
