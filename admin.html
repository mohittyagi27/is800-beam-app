<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — IS 800 Beam Design Tool</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1120;--panel:#111827;--border:#1e3050;--accent:#38bdf8;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e;--gold:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;padding:16px}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;margin-bottom:14px}
#gate{max-width:360px;margin:80px auto;text-align:center}
table{width:100%;border-collapse:collapse;font-size:11px;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th{background:#0b1120;color:var(--muted);padding:8px;text-align:left;font-size:10px;letter-spacing:1px}
td{padding:8px;border-top:1px solid var(--border)}
.badge{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:bold}
.b-trial{background:#1e3050;color:var(--accent)}
.b-active{background:#052e16;color:var(--green)}
.b-expired{background:#1c0a0a;color:var(--red)}
.b-admin{background:#3b1e5c;color:#c4b5fd}
select,input{background:#0b1120;border:1px solid #334155;color:var(--text);padding:4px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:10px}
button{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:4px;font-size:10px;cursor:pointer;font-family:'Courier New',monospace}
button:hover{background:var(--accent);color:#000}
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 16px}
.stat .l{font-size:9px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:bold;color:var(--accent)}
</style>
</head>
<body>

<div id="gate">
  <h1>⚙ ADMIN — CHECKING ACCESS…</h1>
</div>

<div id="dashboard" style="display:none">
  <h1>⚙ ADMIN DASHBOARD</h1>
  <div class="stats">
    <div class="stat"><div class="l">TOTAL USERS</div><div class="v" id="st-total">—</div></div>
    <div class="stat"><div class="l">ACTIVE SUBSCRIBERS</div><div class="v" id="st-active">—</div></div>
    <div class="stat"><div class="l">ON TRIAL</div><div class="v" id="st-trial">—</div></div>
    <div class="stat"><div class="l">TRIAL EXPIRED (NOT PAID)</div><div class="v" id="st-expired">—</div></div>
  </div>
  <table>
    <thead><tr><th>Email</th><th>Status</th><th>Uses</th><th>Plan</th><th>Expiry</th><th>Actions</th></tr></thead>
    <tbody id="user-rows"></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async user=>{
  if(!user){window.location.href="login.html";return;}
  if(user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    document.getElementById("gate").innerHTML="<h1 style='color:var(--red)'>⛔ ACCESS DENIED</h1><p style='color:var(--muted);font-size:11px;margin-top:8px'>Ye page sirf admin ke liye hai.</p>";
    return;
  }
  document.getElementById("gate").style.display="none";
  document.getElementById("dashboard").style.display="block";
  loadUsers();
});

async function loadUsers(){
  const snap=await db.collection("users").orderBy("createdAt","desc").get();
  const rows=document.getElementById("user-rows");
  rows.innerHTML="";
  let total=0,active=0,trial=0,expired=0;
  const now=Date.now();
  snap.forEach(doc=>{
    const d=doc.data(),id=doc.id;
    total++;
    const expiryMs=d.subscriptionExpiry?d.subscriptionExpiry.toMillis():null;
    const isActive=(d.plan==="monthly"||d.plan==="yearly")&&expiryMs&&expiryMs>now;
    const usedUp=(d.usageCount||0)>=FREE_TRIAL_USES && !isActive;
    let statusBadge;
    if(d.isAdmin)statusBadge=`<span class="badge b-admin">ADMIN</span>`;
    else if(isActive){statusBadge=`<span class="badge b-active">ACTIVE — ${d.plan}</span>`;active++;}
    else if(usedUp){statusBadge=`<span class="badge b-expired">TRIAL USED — NOT PAID</span>`;expired++;}
    else{statusBadge=`<span class="badge b-trial">ON TRIAL</span>`;trial++;}
    const expiryStr=expiryMs?new Date(expiryMs).toLocaleDateString():"—";
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${d.email}</td>
      <td>${statusBadge}</td>
      <td>${d.usageCount||0} / ${FREE_TRIAL_USES}</td>
      <td>${d.plan||"trial"}</td>
      <td>${expiryStr}</td>
      <td>
        <button onclick="grantAccess('${id}','monthly')">+1mo</button>
        <button onclick="grantAccess('${id}','yearly')">+1yr</button>
        <button onclick="revokeAccess('${id}')" style="border-color:var(--red);color:var(--red)">Revoke</button>
      </td>`;
    rows.appendChild(tr);
  });
  document.getElementById("st-total").textContent=total;
  document.getElementById("st-active").textContent=active;
  document.getElementById("st-trial").textContent=trial;
  document.getElementById("st-expired").textContent=expired;
}

async function grantAccess(uid,plan){
  const days=plan==="monthly"?30:365;
  const expiry=new Date(Date.now()+days*24*60*60*1000);
  await db.collection("users").doc(uid).update({
    plan,
    subscriptionExpiry: firebase.firestore.Timestamp.fromDate(expiry)
  });
  loadUsers();
}
async function revokeAccess(uid){
  if(!confirm("Is user ka access revoke karna hai (wapas trial-only ho jayega)?"))return;
  await db.collection("users").doc(uid).update({
    plan:"trial",
    subscriptionExpiry:null
  });
  loadUsers();
}
</script>
</body>
</html>
