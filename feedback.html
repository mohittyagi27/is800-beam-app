<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — IS 800 Beam Design Tool</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1120;--panel:#111827;--border:#1e3050;--accent:#38bdf8;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;width:100%;max-width:400px}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.sub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:20px;letter-spacing:1px}
label{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px;margin-top:12px}
select,textarea,input{width:100%;background:#0b1120;border:1px solid #334155;color:var(--text);padding:9px 10px;border-radius:6px;font-family:'Courier New',monospace;font-size:13px;outline:none}
textarea{min-height:120px;resize:vertical}
button{width:100%;padding:11px;background:var(--accent);border:none;border-radius:6px;color:#000;cursor:pointer;font-size:12px;font-weight:bold;font-family:'Courier New',monospace;letter-spacing:1px;margin-top:16px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:11px;text-align:center;margin-top:12px;min-height:14px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>💬 FEEDBACK</h1>
  <div class="sub">Apna suggestion, bug report, ya sawal bhejein</div>

  <label>Type</label>
  <select id="type">
    <option value="Suggestion">Suggestion</option>
    <option value="Bug Report">Bug Report</option>
    <option value="Question">Question</option>
    <option value="Other">Other</option>
  </select>
  <label>Aapka message</label>
  <textarea id="message" placeholder="Yahan likhein..."></textarea>

  <button id="btnSend" onclick="sendFeedback()">SUBMIT FEEDBACK</button>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="index.html">← Back to Calculator</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function setMsg(text,cls){const m=document.getElementById("msg");m.textContent=text;m.className="msg "+(cls||"");}

auth.onAuthStateChanged(user=>{
  if(!user){window.location.href="login.html";}
});

async function sendFeedback(){
  const user=auth.currentUser;
  if(!user){setMsg("Pehle login karo.","err");return;}
  const type=document.getElementById("type").value;
  const message=document.getElementById("message").value.trim();
  if(!message){setMsg("Message likhna zaroori hai.","err");return;}
  const btn=document.getElementById("btnSend");
  btn.disabled=true;setMsg("Bhej raha hai...","");
  try{
    await db.collection("feedback").add({
      email:user.email,
      uid:user.uid,
      type,
      message,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      status:"new"
    });
    setMsg("Dhanyawad! Aapka feedback mil gaya.","ok");
    document.getElementById("message").value="";
    btn.disabled=false;
  }catch(e){
    setMsg("Bhejne mein error aayi, dobara try karo.","err");
    btn.disabled=false;
  }
}
</script>
</body>
</html>
