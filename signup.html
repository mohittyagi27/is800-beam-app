<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — IS 800 Beam Design Tool</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b1120;--panel:#111827;--border:#1e3050;--accent:#38bdf8;--text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;width:100%;max-width:360px;position:relative}
.lang-switch{position:absolute;top:14px;right:14px;background:#0b1120;border:1px solid #334155;color:var(--text);font-size:10px;padding:4px 6px;border-radius:5px;font-family:'Courier New',monospace}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;text-align:center;margin-bottom:4px}
.sub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:20px;letter-spacing:1px}
.tabs2{display:flex;gap:0;margin-bottom:18px;border:1px solid #334155;border-radius:8px;overflow:hidden}
.tabs2 a{flex:1;text-align:center;padding:9px 4px;font-size:11px;text-decoration:none;color:var(--muted);font-weight:bold;letter-spacing:.5px}
.tabs2 a.active{background:var(--accent);color:#000}
label{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px;margin-top:12px}
input{width:100%;background:#0b1120;border:1px solid #334155;color:var(--text);padding:9px 10px;border-radius:6px;font-family:'Courier New',monospace;font-size:13px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;padding:11px;background:var(--accent);border:none;border-radius:6px;color:#000;cursor:pointer;font-size:12px;font-weight:bold;font-family:'Courier New',monospace;letter-spacing:1px;margin-top:14px}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-google{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:8px}
.msg{font-size:11px;text-align:center;margin-top:12px;min-height:14px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.foot a{color:var(--accent);text-decoration:none}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:#475569;font-size:10px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#334155}
.hidden{display:none}
.phone-row{display:flex;gap:6px;align-items:flex-end}
.success-box{text-align:center}
.success-box .tick{font-size:34px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card" id="signup-card">
  <select class="lang-switch" onchange="setLang(this.value)"><option value="en">EN</option><option value="hi">हिं</option></select>
  <div class="tabs2"><a href="signup.html" class="active">CREATE ACCOUNT</a><a href="login.html">LOG IN</a></div>
  <h1 data-i18n="signup_title">⚙ CREATE ACCOUNT</h1>
  <div class="sub" data-i18n="signup_sub">IS 800 STEEL BEAM DESIGN TOOL</div>

  <button class="btn-google" onclick="doGoogleSignup()"><span>🔵</span> <span data-i18n="google_btn">Continue with Google</span></button>
  <div class="divider" data-i18n="or">— or —</div>

  <label data-i18n="email_label">Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label data-i18n="password_label">Password (min 6 characters)</label>
  <input type="password" id="password" placeholder="••••••••">
  <label data-i18n="confirm_password_label">Confirm Password</label>
  <input type="password" id="password2" placeholder="••••••••">

  <label>Phone Number <span style="color:var(--red)">*</span></label>
  <div class="phone-row">
    <input type="text" value="+91" style="width:56px;flex-shrink:0" id="phoneCode">
    <input type="tel" id="phoneNumber" placeholder="9876543210" required>
  </div>

  <button id="btnSignup" onclick="doSignup()" data-i18n="signup_btn">SIGN UP — 3 FREE CALCULATIONS</button>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="help.html" style="color:#64748b" data-i18n="help_link">❓ How to use this app</a></div>
</div>

<div class="card success-box hidden" id="success-card">
  <div class="tick">✅</div>
  <h1 style="color:var(--green)">ACCOUNT CREATED SUCCESSFULLY!</h1>
  <div class="sub" style="margin-top:10px;font-size:11px;line-height:1.6">
    Aapke email pe ek <b style="color:var(--accent)">verification link</b> bheja gaya hai.<br>
    Pehle wo link kholke email verify karo, phir login karo.
  </div>
  <button onclick="location.href='login.html'">GO TO LOGIN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="translations.js"></script>
<script>
function setMsg(text,cls){const m=document.getElementById("msg");m.textContent=text;m.className="msg "+(cls||"");}

async function doGoogleSignup(){
  const code=document.getElementById("phoneCode").value.trim();
  const phone=document.getElementById("phoneNumber").value.trim();
  if(!phone){setMsg("Phone number daalna zaroori hai.","err");return;}
  setMsg("Google ke sath sign up ho raha hai...","");
  try{
    const cred=await auth.signInWithPopup(googleProvider);
    await ensureUserDoc(cred.user, {phone:code+phone, phoneVerified:false});
    // Google accounts are already email-verified by Google — no extra step needed.
    window.location.href="index.html";
  }catch(e){
    setMsg("Google sign-up fail hua: "+(e.message||""),"err");
  }
}

async function doSignup(){
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("password").value;
  const pw2=document.getElementById("password2").value;
  const code=document.getElementById("phoneCode").value.trim();
  const phone=document.getElementById("phoneNumber").value.trim();
  if(!email||!pw){setMsg("Email aur password dono bharo.","err");return;}
  if(pw.length<6){setMsg("Password kam se kam 6 characters ka hona chahiye.","err");return;}
  if(pw!==pw2){setMsg("Passwords match nahi kar rahe.","err");return;}
  if(!phone){setMsg("Phone number daalna zaroori hai.","err");return;}
  const btn=document.getElementById("btnSignup");
  btn.disabled=true;setMsg("Account ban raha hai...","");
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pw);
    await ensureUserDoc(cred.user, {phone:code+phone, phoneVerified:false});
    // Send a real email-ownership verification link — this is what stops
    // someone typing in a fake/random email that isn't actually theirs.
    await cred.user.sendEmailVerification();
    // Do NOT auto-login the user into the app — sign them out and show a
    // clear "account created, please verify" confirmation.
    await auth.signOut();
    document.getElementById("signup-card").classList.add("hidden");
    document.getElementById("success-card").classList.remove("hidden");
  }catch(e){
    let m=e.message||"Kuch galat ho gaya.";
    if(e.code==="auth/email-already-in-use")m="Ye email pehle se registered hai — Login page pe jao.";
    setMsg(m,"err");
    btn.disabled=false;
  }
}
</script>
</body>
</html>
